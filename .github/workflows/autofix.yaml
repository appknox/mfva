# Autofix only. Does not build or upload.
# Run it on the same branch the scan was uploaded from (push to master
# records branch "master"). Autofix picks the latest file on that branch.
name: Autofix

on:
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Minimum risk (low, medium, high, critical)"
        required: false
        default: critical

permissions:
  contents: write
  pull-requests: write

env:
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
  APPKNOX_ACCESS_TOKEN: ${{ secrets.APPKNOX_ACCESS_TOKEN }}

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mfva
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/autofixer-ci-v2
          path: appknox-go

      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .

      - name: Run Appknox autofix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./bin/appknox autofix --risk-threshold "${{ github.event.inputs.riskThreshold }}"
