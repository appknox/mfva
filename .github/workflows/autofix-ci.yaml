# Autofix only. Does not build or upload.
# Run it on the same branch the scan was uploaded from (push to master
# records branch "master"). Autofix picks the latest file on that branch.
#
# This file is autofix-ci.yaml, not autofix.yaml. The old path was committed
# to master and then reverted, so GitHub marked that workflow deleted and
# will not list it again unless the file returns to master. A new path on
# ci/autofix registers as its own workflow and leaves master unchanged.
name: Autofix

on:
  # A workflow that is not on the default branch stays out of the Actions
  # list until it has run once. A push to ci/autofix is that run.
  # The job below runs only from the Actions button.
  push:
    branches:
      - ci/autofix
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Minimum risk (low, medium, high, critical)"
        required: false
        default: low

permissions:
  contents: write
  pull-requests: write

env:
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
  APPKNOX_ACCESS_TOKEN: 3e52a208c84a05f3fb569f3d26e780641351d0cd

jobs:
  autofix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mfva
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/autofixer-ci-v2
          path: appknox-go

      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .

      - name: Run Appknox autofix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./bin/appknox autofix --risk-threshold "${{ github.event.inputs.riskThreshold }}"
