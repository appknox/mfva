# The name of our workflow
name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL
env:
  RISK_THRESHOLD: CRITICAL
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build the app
        run: ./gradlew bundle
      - uses: actions/upload-artifact@v2
        with:
          name: mfva.aab
          path: app/build/outputs/bundle/debug/app.aab
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feat/autofix-cli
          path: appknox-go
      - name: Build appknox CLI
        run: |
          cd appknox-go
          go build -o appknox .
      - name: Upload app and run Appknox cicheck
        env:
          APPKNOX_ACCESS_TOKEN: 6ee71b7f954eb17b7e8bc759e5de1389309f16e6
          APPKNOX_API_HOST: https://autofix.staging.appknox.io/
        run: |
          FILE_ID=$(./appknox-go/appknox upload app/build/outputs/bundle/debug/app.aab)
          ./appknox-go/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
