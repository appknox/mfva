# The name of our workflow
name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL
env:
  RISK_THRESHOLD: CRITICAL
  APPKNOX_ACCESS_TOKEN: 6ee71b7f954eb17b7e8bc759e5de1389309f16e6
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
  APPKNOX_AUTOFIX_FIX_TOKEN: 6ee71b7f954eb17b7e8bc759e5de1389309f16e6
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build the app
        run: ./gradlew bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mfva.aab
          path: app/build/outputs/bundle/debug/app.aab
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feat/autofix-cli
          path: appknox-go
      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .
      - name: Upload app and run Appknox cicheck
        id: appknox_scan
        continue-on-error: true
        run: |
          FILE_ID=$(./bin/appknox upload app/build/outputs/bundle/debug/app.aab --knoxiq)
          echo "Uploaded file id: $FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          ./bin/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
      - name: Run Appknox autofix
        if: steps.appknox_scan.outputs.file_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPKNOX=./bin/appknox
          FILE_ID="${{ steps.appknox_scan.outputs.file_id }}"
          FIX_URL="https://autofix.staging.appknox.io"

          risk_rank() {
            case "$(echo "$1" | tr '[:upper:]' '[:lower:]')" in
              low) echo 1 ;;
              medium) echo 2 ;;
              high) echo 3 ;;
              critical) echo 4 ;;
              *) echo 0 ;;
            esac
          }

          THRESHOLD_RANK=$(risk_rank "${RISK_THRESHOLD}")
          LIST_OUT=""
          for i in $(seq 1 30); do
            if LIST_OUT=$($APPKNOX autofix --file-id "$FILE_ID" --list-analyses 2>&1); then
              echo "$LIST_OUT"
              break
            fi
            echo "$LIST_OUT"
            if ! echo "$LIST_OUT" | grep -qi "knoxiq is not completed"; then
              echo "list-analyses failed"
              exit 1
            fi
            echo "Waiting for KnoxIQ... ($i/30)"
            sleep 30
            LIST_OUT=""
          done
          if [ -z "$LIST_OUT" ]; then
            echo "KnoxIQ did not complete in time"
            exit 1
          fi

          FIXED=0
          while IFS= read -r line; do
            echo "$line" | grep -qE '^[+*]' || continue
            aid=$(echo "$line" | sed -n 's/.*id=\([0-9][0-9]*\).*/\1/p')
            risk=$(echo "$line" | sed -n 's/.*risk=\([^ ]*\).*/\1/p')
            [ -n "$aid" ] || continue
            rank=$(risk_rank "$risk")
            if [ "$rank" -lt "$THRESHOLD_RANK" ]; then
              echo "Skipping analysis $aid (risk=$risk below ${RISK_THRESHOLD})"
              continue
            fi
            echo "Autofixing analysis $aid (risk=$risk)"
            $APPKNOX autofix \
              --file-id "$FILE_ID" \
              --analysis-id "$aid" \
              --fix-url "$FIX_URL" \
              --repo-path "$GITHUB_WORKSPACE" \
              --ref "${GITHUB_REF_NAME}"
            FIXED=$((FIXED + 1))
          done <<< "$LIST_OUT"

          if [ "$FIXED" -eq 0 ]; then
            echo "No locatable analyses at or above ${RISK_THRESHOLD} to autofix"
          else
            echo "Autofix completed for $FIXED analysis/analyses"
          fi
      - name: Fail if cicheck found issues
        if: steps.appknox_scan.outcome == 'failure'
        run: exit 1
