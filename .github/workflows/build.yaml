# The name of our workflow
name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      healthScore:
        description: "Minimum health score (0-100) to pass CI"
        required: false
        default: "50"
      riskThreshold:
        description: "Risk Threshold (LOW/MEDIUM/HIGH/CRITICAL) — mutually exclusive with healthScore"
        required: false
        default: ""
      sastTimeout:
        description: "Static scan timeout in minutes"
        required: false
        default: "30"
      sarif:
        description: "Enable SARIF report (Enable/Disable)"
        required: false
        default: "Disable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 1.8
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build the app
        run: ./gradlew bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mfva.aab
          path: app/build/outputs/bundle/debug/app.aab
      - name: Appknox GitHub action
        uses: appknox/appknox-github-action@healthscore
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          file_path: app/build/outputs/bundle/debug/app.aab
          health_score: ${{ github.event.inputs.healthScore }}
          # risk_threshold: ${{ github.event.inputs.riskThreshold }}
          sast_timeout: ${{ github.event.inputs.sastTimeout }}
          sarif: ${{ github.event.inputs.sarif }}