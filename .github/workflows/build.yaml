# Build gate.
#
# This runs on every pull request, which is what makes it a gate on autofix: an
# autofix PR proposes a change to source it has never compiled -- the fixer runs
# on a runner with no build, by design, because the customer's toolchain is not
# ours to assume. So the compiler has to be the thing that checks it, here.
#
# That is not hypothetical. mfva PR #18 shipped a fix that dropped the "BC"
# provider argument from Cipher.getInstance, which selected the single-argument
# overload, orphaned the existing multi-catch, and stopped the app compiling:
#
#   ExportedActivity.java:27: error: exception NoSuchProviderException is
#   never thrown in body of corresponding try statement
#
# Nothing caught it. It sat in the branch until a later run tripped over it.
name: Build
on:
  push:
    branches:
      - master
  # Every PR, so autofix branches are compiled before anyone reviews them.
  pull_request:
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL
env:
  RISK_THRESHOLD: CRITICAL
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # The gate itself. A fix that does not compile fails here, before review.
      - name: Build the app
        run: ./gradlew bundle
      # v2 was retired and GitHub auto-fails any run that requests it, so this
      # workflow could not start at all -- the reason the build gate was absent
      # exactly when autofix needed it.
      - uses: actions/upload-artifact@v4
        with:
          name: mfva.aab
          path: app/build/outputs/bundle/debug/app.aab
      # Scanning is skipped on pull requests, deliberately.
      #
      # mfva is a deliberately vulnerable app, so the CRITICAL risk gate always
      # fails here. A check that is red no matter what teaches reviewers to
      # ignore it, and would drown the compile signal this gate exists to give.
      # Findings are tracked by the Autofix E2E workflow, which scans on purpose.
      - name: Appknox GitHub action
        if: github.event_name != 'pull_request'
        uses: appknox/appknox-github-action@1.0.0
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          file_path: app/build/outputs/bundle/debug/app.aab
          risk_threshold: ${{ env.RISK_THRESHOLD }}
