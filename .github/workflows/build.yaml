# The name of our workflow
name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      thresholdType:
        description: "Threshold to enforce: RISK, HEALTH_SCORE, EXPLOIT_LIKELIHOOD"
        required: false
        default: ""
      caseId:
        description: "Validation case id, shown in the scan step name"
        required: false
        default: ""
      healthScore:
        description: "Minimum health score (0-100) to pass CI"
        required: false
        default: ""
      riskThreshold:
        description: "Risk Threshold (LOW/MEDIUM/HIGH/CRITICAL) — mutually exclusive with healthScore"
        required: false
        default: ""
      sastTimeout:
        description: "Static scan timeout in minutes"
        required: false
        default: "30"
      sarif:
        description: "Enable SARIF report (Enable/Disable)"
        required: false
        default: "Disable"
      trigger_knoxiq:
        description: "Trigger KnoxIQ"
        type: boolean
        default: false
      generate_pdf_report:
        description: "Generate PDF report"
        type: boolean
        default: false
      exploit_likelihood_threshold:
        description: "Use exploit threshold as the type."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build the app
        run: ./gradlew bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mfva.aab
          path: app/build/outputs/bundle/debug/app.aab
      - name: Appknox GitHub action (${{ github.event.inputs.caseId }})
        id: appknox-scan
        uses: appknox/appknox-github-action@main
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          file_path: app/build/outputs/bundle/debug/app.aab
          threshold_type: ${{ github.event.inputs.thresholdType }}
          health_score: ${{ github.event.inputs.healthScore }}
          risk_threshold: ${{ github.event.inputs.riskThreshold }}
          sast_timeout: ${{ github.event.inputs.sastTimeout }}
          sarif: ${{ github.event.inputs.sarif }}
          trigger_knoxiq: ${{ github.event.inputs.trigger_knoxiq }}
          generate_pdf_report: ${{ github.event.inputs.generate_pdf_report }}
          exploit_likelihood_threshold: ${{ github.event.inputs.exploit_likelihood_threshold }}
      - name: Upload Appknox PDF report
        if: always() && steps.appknox-scan.outputs.pdf_report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: appknox-reports
          path: |
            ${{ steps.appknox-scan.outputs.pdf_report_path }}
            ${{ steps.appknox-scan.outputs.pdf_report_password_path }}
            
